services:

  db:
    image: postgres:15-alpine
    container_name: jarvis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: jarvis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: jarvis-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/jarvis_db
      SECRET_KEY: jarvis-super-secret-key-make-this-very-long-2024
      GROQ_API_KEY: ${GROQ_API_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: jarvis-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: